version: '3.8'

services:
  tawasol-risk-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyber-security-assistant
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANONYMIZED_TELEMETRY=False
    env_file:
      - .env
    restart: unless-stopped
